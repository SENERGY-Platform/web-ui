# Read by SonarQube Cloud's automatic analysis, which ignores sonar-project.properties.
# scripts/ holds developer tooling that never reaches the image, so its command-line paths
# are not an attack surface. The exact file is named next to the pattern because the
# documentation states wildcards may not be honoured in this file.
sonar.exclusions=scripts/**/*,scripts/vendor-scriptenv-types.mjs
