name: 'NEXT Docker Image'

# Preview image for the upgrade branch, deployed as ui-next.senergy.infai.org.
# No github-tag-action here: its release_branches ".*" would cut a semver tag from this branch.
on:
  push:
    branches:
      - feat/ui-upgrade
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  multi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Short commit id
        id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=next-${{ steps.short_sha.outputs.sha }}
          push: true
          tags: |
            ghcr.io/senergy-platform/web-ui:next
            ghcr.io/senergy-platform/web-ui:next-${{ steps.short_sha.outputs.sha }}
          cache-from: type=gha,scope=next
          cache-to: type=gha,mode=max,scope=next
