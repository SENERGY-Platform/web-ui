name: 'PROD Docker Image'

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # A push touching only these produces no image and, more to the point, no tag:
    # this workflow cuts the release itself, so without the filter every typo in a
    # document becomes a version. A push that touches one of these *and* anything
    # else still builds - the filter skips only when every changed file matches.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  # tagging is the release, so red tests leave no tag and no image behind
  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  multi:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: ./build/Dockerfile
      build-args: |
        COMMIT=${{ github.sha }}
        VERSION=${{ needs.version.outputs.tag }}
      cache: true
      cache-mode: max
      meta-images: |
        smartenergyplatform/web-ui
        ghcr.io/senergy-platform/web-ui
      meta-tags: |
        type=raw,value=prod
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=latest
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
