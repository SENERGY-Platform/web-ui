name: 'DEV Docker Image'

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # See prod.yml.
  multi:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: ./build/Dockerfile
      build-args: |
        COMMIT=${{ github.sha }}
      cache: true
      cache-mode: max
      meta-images: |
        smartenergyplatform/web-ui
        ghcr.io/senergy-platform/web-ui
      meta-tags: |
        type=raw,value=dev
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
