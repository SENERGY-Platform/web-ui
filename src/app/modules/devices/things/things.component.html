<senergy-page-header title="Things" description="Things are without measurements of their own; devices can be linked to them for a period of time.">
  <ng-container pageActions>
    @if (userHasCreateAuthorization) {
      <button matButton="filled" (click)="newThing()">
        <mat-icon>add</mat-icon> New thing
      </button>
    }
  </ng-container>
</senergy-page-header>

<senergy-list-toolbar [selectedCount]="selection.selected.length" (clearSelection)="selectionClear()" (refresh)="reload()">
  <ng-container bulkActions>
    @if (userHasDeleteAuthorization) {
      <button matButton="outlined" color="warn" (click)="deleteMultipleItems()">
        <mat-icon>delete</mat-icon> Delete
      </button>
    }
  </ng-container>
</senergy-list-toolbar>

<div class="page-body">
  <senergy-spinner [elementCount]="dataSource.data.length" [show]="!ready"></senergy-spinner>

  @if (dataSource.data.length === 0 && ready) {
    <senergy-empty-state icon="devices_other" [title]="filtered ? 'No matching things' : 'No things yet'"
      [text]="filtered ? 'No thing matches the search.' : ''">
    </senergy-empty-state>
  }

  <div class="list-card" [hidden]="!ready || dataSource.data.length === 0">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="matSortChange($event)"
        [matSortActive]="list.sortBy" [matSortDirection]="list.sortDirection">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="select-column">
            <mat-checkbox (change)="$event ? masterToggle() : null"
              [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()"
              aria-label="Select all">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row" class="select-column" (click)="$event.stopPropagation()">
            <mat-checkbox (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)"
              [disabled]="!userHasAdministratePermission(row.id)" aria-label="Select row">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let thing" class="name-cell">{{thing.name}}</td>
        </ng-container>

        <ng-container matColumnDef="devices">
          <th mat-header-cell *matHeaderCellDef class="num">Devices</th>
          <td mat-cell *matCellDef="let thing" class="num">{{openDeviceLinkCount(thing)}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column"><span class="cdk-visually-hidden">Actions</span></th>
          <td mat-cell *matCellDef="let thing" class="actions-column">
            <button mat-icon-button [matMenuTriggerFor]="rowMenu" (click)="$event.stopPropagation()" aria-label="Actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #rowMenu="matMenu" xPosition="before">
              @if (canEdit(thing)) {
                <button mat-menu-item (click)="editThing(thing)"><mat-icon>edit</mat-icon> Edit</button>
              } @else {
                <button mat-menu-item (click)="editThing(thing)"><mat-icon>info</mat-icon> Details</button>
              }
              @if (canShare(thing)) {
                <button mat-menu-item (click)="shareThing(thing)"><mat-icon>share</mat-icon> Share</button>
              }
              @if (canDelete(thing)) {
                <button mat-menu-item class="danger" (click)="deleteThing(thing)"><mat-icon>delete</mat-icon> Delete</button>
              }
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let thing; columns: displayedColumns;" class="clickable-row" (click)="editThing(thing)"></tr>
      </table>
    </div>

    <mat-paginator #paginator senergyKeepPageInRange [length]="totalCount" [pageSize]="list.pageSize" [pageIndex]="list.pageIndex"
      [pageSizeOptions]="[20, 50, 75, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
