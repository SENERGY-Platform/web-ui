@if (locationForm) {
  <div class="container">
    <senergy-page-header [title]="id === '' ? 'New location' : (savedName || 'Location')"
      backLabel="Locations" backLink="/devices/locations"></senergy-page-header>
    <div class="page">
      <senergy-form-section title="General">
        <div [formGroup]="locationForm">
          <mat-form-field class="full-width field-limit">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" required>
            <mat-error senergyError label="Name"></mat-error>
          </mat-form-field>
          <mat-form-field class="full-width field-limit">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description"></textarea>
            <mat-error senergyError label="Description"></mat-error>
          </mat-form-field>
          <mat-form-field class="full-width field-limit">
            <mat-label>Image</mat-label>
            <input matInput formControlName="image">
            <mat-error senergyError label="Image"></mat-error>
          </mat-form-field>
        </div>
      </senergy-form-section>

      <senergy-form-section title="Device groups">
        <button sectionActions matButton type="button" [disabled]="isSaving" (click)="selectAndAddGroups()">
          <mat-icon>add</mat-icon>
          Add groups
        </button>
        <div class="device-list">
          @for (item of deviceGroupsForm.value; track item.id) {
            <div class="device-row">
              <span class="device-name" [matTooltip]="item.name">{{item.name}}</span>
              <button mat-icon-button type="button" [disabled]="isSaving" (click)="removeDeviceGroup(item.id)"
                matTooltip="Remove" aria-label="Remove device group">
                <mat-icon>close</mat-icon>
              </button>
            </div>
          } @empty {
            <p class="empty">No device groups.</p>
          }
        </div>
      </senergy-form-section>

      <senergy-form-section title="Devices">
        <button sectionActions matButton type="button" [disabled]="isSaving" (click)="selectAndAddDevices()">
          <mat-icon>add</mat-icon>
          Add devices
        </button>
        <div class="device-list">
          @for (item of devicesForm.value; track item.id) {
            <div class="device-row">
              <span class="device-name" [matTooltip]="item.name">{{item.name}}</span>
              <button mat-icon-button type="button" [disabled]="isSaving" (click)="removeDevice(item.id)"
                matTooltip="Remove" aria-label="Remove device">
                <mat-icon>close</mat-icon>
              </button>
            </div>
          } @empty {
            <p class="empty">No devices.</p>
          }
        </div>
      </senergy-form-section>
    </div>
    @if (hasChanges() || isSaving) {
      <senergy-save-bar [saveDisabled]="saveDisabled()" [status]="saveStatus()" (save)="save()"
        (discard)="discard()"></senergy-save-bar>
    }
  </div>
}
