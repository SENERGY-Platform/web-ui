<senergy-dialog-header title="Used In Device-Types" (closed)="close()"></senergy-dialog-header>

<mat-dialog-content>
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    @if (!userHasUpdateAuthorization) {
      <ng-container matColumnDef="view">
        <th mat-header-cell *matHeaderCellDef disableClear class="button-column">Info</th>
        <td mat-cell *matCellDef="let element">
          <a (click)="close()" [routerLink]="'/metadata/devicetypesoverview/devicetypes/' + element.id">
            view
          </a>
        </td>
      </ng-container>
    }

    @if (userHasUpdateAuthorization) {
      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef disableClear class="button-column">Edit</th>
        <td mat-cell *matCellDef="let element">
          <a (click)="close()"  [routerLink]="'/metadata/devicetypesoverview/devicetypes/' + element.id">
            edit
          </a>
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" (click)="close()">Close</button>
</mat-dialog-actions>
