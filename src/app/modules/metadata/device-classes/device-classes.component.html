<senergy-page-header title="Device classes" description="Kinds of devices, such as a lamp or a thermostat, that device types are assigned to.">
  <ng-container pageActions>
    @if (userHasCreateAuthorization) {
      <button matButton="filled" (click)="newDeviceClass()">
        <mat-icon>add</mat-icon> New device class
      </button>
    }
  </ng-container>
</senergy-page-header>

<senergy-list-toolbar [selectedCount]="selection.selected.length" (clearSelection)="selectionClear()" (refresh)="reload()">
  <ng-container bulkActions>
    @if (userHasDeleteAuthorization) {
      <button matButton="outlined" color="warn" (click)="deleteMultipleItems()">
        <mat-icon>delete</mat-icon> Delete
      </button>
    }
  </ng-container>
</senergy-list-toolbar>

<div class="page-body">
  <senergy-spinner [elementCount]="dataSource.data.length" [show]="!ready"></senergy-spinner>

  @if (dataSource.data.length === 0 && ready) {
    <senergy-empty-state icon="category" [title]="filtered ? 'No matching device classes' : 'No device classes yet'"
      [text]="filtered ? 'No device class matches the search.' : 'Device classes group device types by the kind of device, such as lamp or thermostat.'">
    </senergy-empty-state>
  }

  <div class="list-card" [hidden]="!ready || dataSource.data.length === 0">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="matSortChange($event)"
        [matSortActive]="list.sortBy" [matSortDirection]="list.sortDirection">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="select-column">
            <mat-checkbox (change)="$event ? masterToggle() : null"
              [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()"
              aria-label="Select all">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row" class="select-column" (click)="$event.stopPropagation()">
            <mat-checkbox (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)"
              aria-label="Select row">
            </mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let deviceClass" class="name-cell">{{deviceClass.name}}</td>
        </ng-container>

        @if (userHasUsedInAuthorization) {
          <ng-container matColumnDef="useCount">
            <th mat-header-cell *matHeaderCellDef class="num count-column">Used in</th>
            <td mat-cell *matCellDef="let deviceClass" class="num">
              <button class="count-link" matTooltip="Uses of the device class in device types"
                (click)="$event.stopPropagation(); showUsedInDialog(usedIn.get(deviceClass.id))">
                {{usedIn.get(deviceClass.id)?.count || 0}}
              </button>
            </td>
          </ng-container>
        }

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column"><span class="cdk-visually-hidden">Actions</span></th>
          <td mat-cell *matCellDef="let deviceClass" class="actions-column">
            <button mat-icon-button [matMenuTriggerFor]="rowMenu" (click)="$event.stopPropagation()" aria-label="Actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #rowMenu="matMenu" xPosition="before">
              @if (userHasUpdateAuthorization) {
                <button mat-menu-item (click)="editDeviceClass(deviceClass)"><mat-icon>edit</mat-icon> Edit</button>
              } @else {
                <button mat-menu-item (click)="showDeviceClass(deviceClass)"><mat-icon>info</mat-icon> Details</button>
              }
              @if (userHasDeleteAuthorization) {
                <button mat-menu-item class="danger" (click)="deleteDeviceClass(deviceClass)"><mat-icon>delete</mat-icon> Delete</button>
              }
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let deviceClass; columns: displayedColumns;" class="clickable-row" (click)="openDeviceClass(deviceClass)"></tr>
      </table>
    </div>

    <mat-paginator #paginator [length]="totalCount" [pageSize]="list.pageSize" [pageSizeOptions]="[20, 50, 75, 100]"
    showFirstLastButtons></mat-paginator>
  </div>
</div>
