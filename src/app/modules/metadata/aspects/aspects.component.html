<div class="aspects-container layout-margin" fxLayout="column" cdkDropListGroup>
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree">
        <mat-tree-node *matTreeNodeDef="let node" cdkDropList (cdkDropListDropped)="dropped($event, node)">
            <li class="mat-tree-node" fxLayout="row" matTreeNodeToggle cdkDrag
                cdkDragDisabled="{{!userIsAdmin || !nodeValid(node)}}"
                [cdkDragData]="node" (cdkDragStarted)="dragStart()" (cdkDragEnded)="dragEnd()">
                <button mat-icon-button disabled></button>
                <button cdkDragHandle mat-icon-button [disabled]="!userIsAdmin || !nodeValid(node)" color="accent" disableRipple class="tree-inline">
                    <mat-icon>drag_handle</mat-icon>
                </button>
                <mat-icon color="warn" class="deprecated-marker tree-inline" *ngIf="deprecated(node)"
                    matTooltip="Replaced by an aspect class. Move device-types to the new root aspects, then delete it.">
                    history
                </mat-icon>
                <mat-form-field class="aspect-class" appearance="outline" color="accent"
                    *ngIf="showsAspectClassField(node)">
                    <mat-label>Aspect Class</mat-label>
                    <mtx-select [(ngModel)]="node.aspect_class_id" [ngModelOptions]="{standalone: true}"
                        [items]="aspectClasses" bindValue="id" bindLabel="name" [clearable]="true"
                        [disabled]="!userIsAdmin" [addTag]="addAspectClass" addTagText="Create aspect class: "
                        appendTo=".ng-select-anchor"></mtx-select>
                </mat-form-field>
                <mat-form-field class="full-width" appearance="outline" color="accent" fxFlex
                    [ngClass]="{'deprecated-name': deprecated(node)}">
                    <mat-label>Name</mat-label>
                    <input matInput [(ngModel)]="node.name" required [disabled]="!userIsAdmin">
                    <mat-error senergyError label="Name"></mat-error>
                </mat-form-field>
                <button (click)="showUsedInDialog(usedIn?.get(node.id))" class="linkbutton tree-inline" matTooltip="uses of aspect in device-types" *ngIf="userHasUsedInAuthorization">
                    {{usedIn?.get(node.id)?.count || 0}}
                </button>
                <button mat-icon-button disabled *ngIf="!isRootNode(node)"></button>
                <button mat-icon-button *ngIf="isRootNode(node)" (click)="save(node)" color="accent" class="tree-inline"
                        [disabled]="!userIsAdmin || !nodeValid(node)">
                    <mat-icon>save</mat-icon>
                </button>
                <button mat-icon-button (click)="addSubNode(node)" color="accent" class="tree-inline"
                        [disabled]="!userIsAdmin">
                    <mat-icon>add</mat-icon>
                </button>
                <button mat-icon-button disabled class="tree-inline"
                        *ngIf="userIsAdmin && userHasAspectClassReadAuthorization"></button>
                <button mat-icon-button [disabled]="!userIsAdmin" (click)="deleteNode(node)" color="warn"
                        class="tree-inline">
                    <mat-icon>delete</mat-icon>
                </button>

            </li>
        </mat-tree-node>
        <mat-nested-tree-node *matTreeNodeDef="let node; when: isGroupRow">
            <li>
                <div class="mat-tree-node" fxLayout="row" cdkDropList (cdkDropListDropped)="dropped($event, node)">
                    <span fxFlex>
                        <button mat-icon-button matTreeNodeToggle class="nested-tree-inline"
                                [disabled]="!aspectClassInUse(node)"
                                [attr.aria-label]="'Toggle ' + node.name">
                            <mat-icon class="mat-icon-rtl-mirror">
                                {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                            </mat-icon>
                        </button>
                        <button mat-icon-button disabled disableRipple class="nested-tree-inline"
                                matTooltip="Aspect class. The hierarchies below it carry this class.">
                            <mat-icon color="accent">sell</mat-icon>
                        </button>
                        <mat-form-field class="full-width" appearance="outline" color="accent" fxFlex>
                            <mat-label>Aspect Class</mat-label>
                            <input matInput [(ngModel)]="node.name" required
                                   [disabled]="!userHasAspectClassUpdateAuthorization">
                            <mat-error senergyError label="Aspect Class"></mat-error>
                            <mat-hint class="name-taken" *ngIf="aspectClassNameTaken(node)">Another aspect
                                class already has this name.</mat-hint>
                        </mat-form-field>
                        <button mat-icon-button disabled class="nested-tree-inline"
                                *ngIf="userHasUsedInAuthorization"></button>
                        <button mat-icon-button (click)="saveAspectClass(node)" color="accent"
                                class="nested-tree-inline" *ngIf="userHasAspectClassUpdateAuthorization"
                                [disabled]="!aspectClassNameValid(node)" matTooltip="Rename aspect class">
                            <mat-icon>save</mat-icon>
                        </button>
                        <button mat-icon-button disabled class="nested-tree-inline"
                                *ngIf="!userHasAspectClassUpdateAuthorization"></button>
                        <button mat-icon-button (click)="addAspectToClass(node)" color="accent"
                                class="nested-tree-inline" [disabled]="!userIsAdmin"
                                matTooltip="Add a new aspect to this class">
                            <mat-icon>add</mat-icon>
                        </button>
                        <button mat-icon-button disabled class="nested-tree-inline"
                                *ngIf="userIsAdmin && userHasAspectClassReadAuthorization"></button>
                        <button mat-icon-button (click)="deleteAspectClass(node)" color="warn"
                                class="nested-tree-inline" *ngIf="userHasAspectClassDeleteAuthorization"
                                [disabled]="aspectClassInUse(node)"
                                [matTooltip]="aspectClassInUse(node)
                                    ? 'Move or delete the aspects of this class first'
                                    : 'Delete aspect class'">
                            <mat-icon>delete</mat-icon>
                        </button>
                        <button mat-icon-button disabled class="nested-tree-inline"
                                *ngIf="!userHasAspectClassDeleteAuthorization"></button>
                    </span>
                </div>
                <ul [class.tree-invisible]="!treeControl.isExpanded(node)">
                    <ng-container matTreeNodeOutlet></ng-container>
                </ul>
            </li>
        </mat-nested-tree-node>
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
            <li>
                <div class="mat-tree-node" fxLayout="row" cdkDropList (cdkDropListDropped)="dropped($event, node)">
                    <span fxFlex cdkDrag cdkDragDisabled="{{!userIsAdmin || !nodeValid(node)}}" [cdkDragData]="node"
                          (cdkDragStarted)="dragStart()" (cdkDragEnded)="dragEnd()">
                        <button mat-icon-button matTreeNodeToggle class="nested-tree-inline"
                                [attr.aria-label]="'Toggle ' + node.name">
                            <mat-icon class="mat-icon-rtl-mirror">
                                {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                            </mat-icon>
                        </button>
                        <button cdkDragHandle mat-icon-button [disabled]="!userIsAdmin || !nodeValid(node)" color="accent" disableRipple class="nested-tree-inline">
                            <mat-icon>drag_handle</mat-icon>
                        </button>
                        <mat-icon color="warn" class="deprecated-marker nested-tree-inline"
                            *ngIf="deprecated(node)"
                            matTooltip="Replaced by an aspect class. Move device-types to the new root aspects, then delete it.">
                            history
                        </mat-icon>
                        <mat-form-field class="aspect-class" appearance="outline" color="accent"
                            *ngIf="showsAspectClassField(node)">
                            <mat-label>Aspect Class</mat-label>
                            <mtx-select [(ngModel)]="node.aspect_class_id" [ngModelOptions]="{standalone: true}"
                                [items]="aspectClasses" bindValue="id" bindLabel="name" [clearable]="true"
                                [disabled]="!userIsAdmin" [addTag]="addAspectClass" addTagText="Create aspect class: "
                                appendTo=".ng-select-anchor"></mtx-select>
                        </mat-form-field>
                        <mat-form-field class="full-width" appearance="outline" color="accent" fxFlex
                            [ngClass]="{'deprecated-name': deprecated(node)}">
                            <mat-label>Name</mat-label>
                            <input matInput [(ngModel)]="node.name" [disabled]="!userIsAdmin">
                            <mat-error senergyError label="Name"></mat-error>
                        </mat-form-field>
                        <button (click)="showUsedInDialog(usedIn?.get(node.id))" class="linkbutton nested-tree-inline" matTooltip="uses of aspect in device-types" *ngIf="userHasUsedInAuthorization">
                            {{usedIn?.get(node.id)?.count || 0}}
                        </button>
                        <button mat-icon-button disabled *ngIf="!isRootNode(node)"></button>
                        <button mat-icon-button *ngIf="isRootNode(node)" (click)="save(node)" color="accent"
                                class="nested-tree-inline"
                                [disabled]="!userIsAdmin || !nodeValid(node)">
                            <mat-icon>save</mat-icon>
                        </button>
                        <button mat-icon-button (click)="addSubNode(node)" color="accent" class="nested-tree-inline"
                                [disabled]="!userIsAdmin">
                            <mat-icon>add</mat-icon>
                        </button>
                        <button mat-icon-button (click)="convertToAspectClass(node)" color="accent"
                                class="nested-tree-inline" *ngIf="userIsAdmin && userHasAspectClassReadAuthorization"
                                [disabled]="!convertible(node) || !nodeValid(node)"
                                matTooltip="Convert to aspect class, sub-aspects become roots of it">
                            <mat-icon>new_label</mat-icon>
                        </button>
                        <button mat-icon-button [disabled]="!userIsAdmin" (click)="deleteNode(node)" color="warn"
                                class="nested-tree-inline">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </span>
                </div>
                <ul [class.tree-invisible]="!treeControl.isExpanded(node)">
                    <ng-container matTreeNodeOutlet></ng-container>
                </ul>
            </li>
        </mat-nested-tree-node>
    </mat-tree>
    <h3 class="root-drop-zone color-accent" [fxShow]="dragging" cdkDropList (cdkDropListDropped)="dropped($event)">As
        New Aspect Without Class</h3>
</div>
<button mat-fab class="fab" matTooltip="Add new aspect" (click)="newAspect()" *ngIf="userIsAdmin">
    <mat-icon>add</mat-icon>
</button>
