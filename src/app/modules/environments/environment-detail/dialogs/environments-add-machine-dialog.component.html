<h2 mat-dialog-title>New Machine</h2>

<mat-dialog-content>
    <mat-form-field appearance="outline" color="accent">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="name" required>
    </mat-form-field>

    <mat-form-field appearance="outline" color="accent">
        <mat-label>Device type</mat-label>
        <mtx-select [(ngModel)]="deviceType" [compareWith]="compareDeviceTypes" appendTo=".ng-select-anchor" required>
            <mtx-option *ngFor="let t of deviceTypes" [value]="t">{{t.name}}</mtx-option>
        </mtx-select>
        <mat-hint *ngIf="dataReady">Creates the platform device and one channel per service of this type -- sensors and actuators alike.</mat-hint>
        <mat-hint *ngIf="!dataReady">Loading device types...</mat-hint>
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions style="display: flex; justify-content: end;">
    <button mat-raised-button color="primary" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="accent" (click)="create()" [disabled]="!name || !deviceType">Create</button>
</mat-dialog-actions>
