<senergy-dialog-header title="Reject request" (closed)="cancel()"></senergy-dialog-header>

<mat-dialog-content>
  <p class="intro">
    {{data.name}} moves back to the account of its author, who sees the reason.
  </p>

  <mat-form-field appearance="outline" color="accent" class="full-width">
    <mat-label>Reason</mat-label>
    <textarea matInput rows="5" [(ngModel)]="reason" name="reason" required></textarea>
    <mat-hint>What has to change before it can be proposed again.</mat-hint>
    <mat-hint align="end">{{reasonLength}} / {{maxLength}}</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" type="button" (click)="cancel()">Cancel</button>
  <button matButton="filled" type="button" [disabled]="!canReject()" (click)="reject()">Reject</button>
</mat-dialog-actions>
