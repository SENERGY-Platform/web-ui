<div class="layout-margin">
    <span fxLayout="row" class="search-button-container">
        <senergy-searchbar></senergy-searchbar>
    </span>
    <senergy-spinner [show]="!ready"></senergy-spinner>
    <div class="mat-elevation-z1" [hidden]="!ready || reportsDataSource.data.length === 0">
        <div class="table-container">
            <table mat-table [dataSource]="reportsDataSource" matSort matSortActive="name"
                   matSortDirection="asc" matSortDisableClear>

                <ng-container matColumnDef="id">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef>Id</th>
                    <td mat-cell *matCellDef="let element">
                        <div>
                            {{element.id}}
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let element">
                        <div>
                            {{element.name}}
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="createdAt">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef>createdAt</th>
                    <td mat-cell *matCellDef="let element">
                        <div>
                            {{element.createdAt | date:"medium"}}
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="updatedAt">
                    <th mat-header-cell mat-sort-header *matHeaderCellDef>updatedAt</th>
                    <td mat-cell *matCellDef="let element">
                        <div>
                            {{element.updatedAt | date:"medium"}}
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="files">
                    <th mat-header-cell *matHeaderCellDef class="button-column">Files</th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="accent" [disabled]="!element.reportFiles || element.reportFiles.length === 0" routerLink="/reporting/files/{{element.id}}" matTooltip="Files">
                            <mat-icon>folder</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <ng-container matColumnDef="edit">
                    <th mat-header-cell *matHeaderCellDef class="button-column">Edit</th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="accent" routerLink="/reporting/edit/{{element.id}}" matTooltip="Edit">
                            <mat-icon>edit-circle</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <ng-container matColumnDef="delete">
                    <th mat-header-cell *matHeaderCellDef class="button-column">Delete</th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="warn" (click)="deleteReport(element)" matTooltip="Delete">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
        <mat-paginator #paginator [pageSize]="pageSize" [pageSizeOptions]="[20, 50, 75, 100]"
                       showFirstLastButtons></mat-paginator>
    </div>
    <div *ngIf="ready && reportsDataSource.data.length === 0">No reports found.</div>
</div>
