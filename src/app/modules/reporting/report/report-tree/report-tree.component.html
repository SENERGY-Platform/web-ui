@for (node of visibleNodes(); track trackByPath($index, node)) {
  <div>
    <div class="tree-row" [class.selected]="selectedPath === node.path" [style.padding-left.px]="8 + depth * 16"
      (click)="select(node)">
      @if (isContainer(node)) {
        <button mat-icon-button type="button" class="tree-toggle" (click)="toggle(node, $event)"
          [attr.aria-label]="'Toggle ' + node.key">
          <mat-icon>{{isExpanded(node) ? 'expand_more' : 'chevron_right'}}</mat-icon>
        </button>
      }
      @if (!isContainer(node)) {
        <span class="tree-toggle-spacer"></span>
      }
      <mat-icon class="tree-icon">{{icon(node)}}</mat-icon>
      <span class="tree-label">{{node.key}}</span>
      <span class="tree-detail">{{detail(node)}}</span>
      @if (errors(node) > 0) {
        <mat-icon color="warn" class="tree-error"
        [matTooltip]="errors(node) + ' missing input(s)'">warning</mat-icon>
      }
      @if (node.item) {
        <button mat-icon-button type="button" class="tree-action" [matMenuTriggerFor]="rowMenu"
          (click)="$event.stopPropagation()" aria-label="Actions">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #rowMenu="matMenu" xPosition="before">
          <button mat-menu-item type="button" (click)="emitCopyItem(node, $event)">
            <mat-icon>content_copy</mat-icon> Copy item
          </button>
          <button mat-menu-item type="button" class="danger" (click)="emitRemoveItem(node, $event)">
            <mat-icon>delete</mat-icon> Delete item
          </button>
        </mat-menu>
      }
    </div>
    @if (isContainer(node) && isExpanded(node)) {
      <senergy-reporting-tree [nodes]="node.children"
        [depth]="depth + 1" [errorCounts]="errorCounts" [filter]="filter" (copyItem)="copyItem.emit($event)"
        (removeItem)="removeItem.emit($event)">
      </senergy-reporting-tree>
    }
  </div>
}
