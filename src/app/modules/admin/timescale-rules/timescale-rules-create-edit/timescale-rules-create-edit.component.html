<h2 mat-dialog-title>Timescale Rule</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="rule-form">
    <mat-form-field class="full-width">
      <mat-label>ID</mat-label>
      <input matInput formControlName="id">
      <mat-error senergyError label="ID"></mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description" required>
      <mat-error senergyError label="Description"></mat-error>
    </mat-form-field>

    <div class="field-row">
      <mat-form-field class="grow">
        <mat-label>Group</mat-label>
        <input matInput formControlName="group" required>
        <mat-error senergyError label="Group"></mat-error>
      </mat-form-field>
      <mat-form-field class="priority">
        <mat-label>Priority</mat-label>
        <input matInput formControlName="priority" required type="number">
        <mat-error senergyError label="Priority"></mat-error>
      </mat-form-field>
    </div>

    <mat-form-field class="full-width">
      <mat-label>Table Reg Ex</mat-label>
      <input matInput formControlName="table_reg_ex" required class="code">
      <mat-error senergyError label="Table Reg Ex"></mat-error>
    </mat-form-field>

    <div class="field-row">
      <mat-form-field class="grow">
        <mat-label>Users</mat-label>
        <mtx-select formControlName="users" multiple closeOnSelect="false"
        bindLabel="username" bindValue="id" [items]="users" appendTo=".ng-select-anchor"></mtx-select>
        <mat-error senergyError label="Users"></mat-error>
      </mat-form-field>
      <mat-form-field class="grow">
        <mat-label>Roles</mat-label>
        <mtx-select [items]="roles" multiple formControlName="roles"
        closeOnSelect="false" appendTo=".ng-select-anchor"></mtx-select>
        <mat-error senergyError label="Roles"></mat-error>
      </mat-form-field>
    </div>

    <mat-form-field class="full-width">
      <mat-label>Command Template</mat-label>
      <textarea matInput formControlName="command_template" required cdkTextareaAutosize
      cdkAutosizeMinRows="5" class="code"></textarea>
      <mat-error senergyError label="Command Template"></mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Delete Template</mat-label>
      <textarea matInput formControlName="delete_template" cdkTextareaAutosize
      cdkAutosizeMinRows="1" class="code"></textarea>
      <mat-error senergyError label="Delete Template"></mat-error>
    </mat-form-field>

    @if (rule?.errors !== null && rule?.errors !== undefined && (rule?.errors?.length || 0) > 0) {
      <mat-form-field class="full-width" disabled="">
        <mat-label>Errors</mat-label>
        <textarea matInput [value]="(rule?.errors || []).join('\n')" cdkTextareaAutosize
        cdkAutosizeMinRows="1" disabled class="code"></textarea>
      </mat-form-field>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" (click)="close()">Cancel</button>
  @if (editable) {
    <button matButton="filled" (click)="save()" [disabled]="form.invalid">Save</button>
  }
</mat-dialog-actions>
