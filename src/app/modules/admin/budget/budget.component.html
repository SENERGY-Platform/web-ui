<senergy-page-header title="Budgets" description="Limits that apply to a user or a role.">
  <ng-container pageActions>
    <button matButton="filled" (click)="add()">
      <mat-icon>add</mat-icon> New budget
    </button>
  </ng-container>
</senergy-page-header>

<senergy-list-toolbar (refresh)="reload()"></senergy-list-toolbar>

<div class="page-body">
  <senergy-spinner [show]="!dataReady"></senergy-spinner>

  @if (dataReady && dataSource.filteredData.length === 0) {
    <senergy-empty-state icon="savings" [title]="searchText !== '' ? 'No matching budgets' : 'No budgets yet'"
      [text]="searchText !== '' ? 'No budget matches the search.' : 'A budget limits what a user or a role may use.'">
    </senergy-empty-state>
  }

  <div class="list-card" [hidden]="!dataReady || dataSource.filteredData.length === 0">
    <div class="table-container">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="budget_identifier">
          <th mat-header-cell *matHeaderCellDef>Budget</th>
          <td mat-cell *matCellDef="let m" class="name-cell">{{m.budget_identifier}}</td>
        </ng-container>
        <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef>User or role</th>
          <td mat-cell *matCellDef="let m">
            {{subjectName(m)}}
            @if (m.role) {
              <span class="type-chip name-chip">Role</span>
            } @else if (m.user_id) {
              <span class="type-chip name-chip">User</span>
            }
          </td>
        </ng-container>
        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef class="num">Value</th>
          <td mat-cell *matCellDef="let m" class="num">{{m.value}}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-column"><span class="cdk-visually-hidden">Actions</span></th>
          <td mat-cell *matCellDef="let m" class="actions-column">
            <button mat-icon-button [matMenuTriggerFor]="rowMenu" (click)="$event.stopPropagation()" aria-label="Actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #rowMenu="matMenu" xPosition="before">
              <button mat-menu-item (click)="details(m)"><mat-icon>info</mat-icon> Details</button>
              <button mat-menu-item (click)="edit(m)"><mat-icon>edit</mat-icon> Edit</button>
              <button mat-menu-item class="danger" (click)="delete(m)"><mat-icon>delete</mat-icon> Delete</button>
            </mat-menu>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let m; columns: displayedColumns;" class="clickable-row" (click)="details(m)"></tr>
      </table>
    </div>
    <mat-paginator #paginator [pageSize]="preferencesService.pageSize" [pageSizeOptions]="[20, 50, 75, 100]"
      (page)="preferencesService.pageSize = $event.pageSize" showFirstLastButtons></mat-paginator>
  </div>
</div>
