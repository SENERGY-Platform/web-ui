<h2 mat-dialog-title>
  Edit Script<span *ngIf="label">: {{label}}</span>
</h2>

<mat-dialog-content>
  <!-- the separator is drawn in css between adjacent parts, so a missing script
       format does not leave a leading one -->
  <div class="script-hint">
    <span class="script-hint-part" *ngIf="scriptFormat">Script Format: {{scriptFormat}}</span>
    <span class="script-hint-part" *ngIf="variables.length">
      {{variables.length}} process variable(s) available here
    </span>
    <span class="script-hint-part" *ngIf="!variables.length">
      No process variables are set yet at this point in the flow
    </span>
  </div>
  <senergy-code-editor [(value)]="script" [language]="language" [completions]="completions" height="60vh"
                       [scriptEnvironment]="scriptEnvironment">
  </senergy-code-editor>
</mat-dialog-content>

<mat-dialog-actions fxLayoutAlign="end center">
  <button mat-raised-button color="primary" (click)="close()">Cancel</button>
  <button mat-raised-button color="accent" (click)="ok()">Save</button>
</mat-dialog-actions>
