<h2 mat-dialog-title>Start</h2>

<mat-dialog-content>
  @if (err) {
    <mat-error>{{err}}</mat-error>
  }
  @for (recipient of parameter | keyvalue; track recipient) {
    <mat-form-field class="ly-fill" color="accent" appearance="outline">
      <mat-label>{{recipient.key}}: {{recipient.value.type}}</mat-label>
      @if (recipient.value.type === 'String') {
        <input type="text" matInput [(ngModel)]="recipient.value.value">
      }
      @if (recipient.value.type === 'Long') {
        <input type="number" matInput [(ngModel)]="recipient.value.value">
      }
      @if (recipient.value.type === 'Boolean') {
        <mtx-select [(ngModel)]="recipient.value.value"
          appendTo=".ng-select-anchor">
          <mtx-option [value]="true">True</mtx-option>
          <mtx-option [value]="false">False</mtx-option>
        </mtx-select>
      }
      <mat-error senergyError label="{{recipient.key}}: {{recipient.value.type}}"></mat-error>
    </mat-form-field>
  }
</mat-dialog-content>

<mat-dialog-actions class="ly-row ly-align-end-center">
  <button mat-raised-button color="primary" (click)="close()">Cancel</button>
  <button [disabled]="starting" mat-raised-button color="accent" (click)="start()">Start</button>
</mat-dialog-actions>
