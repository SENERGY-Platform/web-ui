<div class="ports-header">
    <h3 [class.section-title]="section">{{title}} <span class="count" *ngIf="rows.length > 0">({{rows.length}})</span></h3>
    <span class="spacer"></span>
    <button mat-stroked-button color="accent" type="button" class="add-button" *ngIf="!readonly" (click)="add()"
        [disabled]="disabled">
        <mat-icon>add</mat-icon>Add {{noun}}
    </button>
</div>
<p class="hint" *ngIf="hint">{{hint}}</p>
<div *ngIf="rows.length === 0" class="empty">No {{noun}}s defined.</div>
<ng-container *ngIf="readonly">
    <div *ngFor="let item of rows" class="port-row readonly-row">
        <span class="port-name">{{item.name}}</span>
        <span class="port-type">{{item.type}}</span>
    </div>
</ng-container>
<ng-container *ngIf="!readonly">
    <div *ngFor="let item of rows" class="port-row">
        <mat-form-field class="port-name" color="accent" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="item.name" [disabled]="disabled" [errorStateMatcher]="nameMatcher(item)">
            <mat-error>{{nameError(item)}}</mat-error>
            <mat-hint class="name-warning" *ngIf="nameWarning(item)">{{nameWarning(item)}}</mat-hint>
        </mat-form-field>
        <mat-form-field class="port-type" color="accent" appearance="outline" subscriptSizing="dynamic">
            <mat-label>Type</mat-label>
            <mtx-select [(ngModel)]="item.type" appendTo=".ng-select-anchor" [disabled]="disabled">
                <mtx-option *ngFor="let option of types" [value]="option">{{option}}</mtx-option>
            </mtx-select>
            <mat-hint class="type-required" *ngIf="typeError(item)">{{typeError(item)}}</mat-hint>
            <mat-hint class="type-warning" *ngIf="typeWarning(item)">{{typeWarning(item)}}</mat-hint>
        </mat-form-field>
        <button mat-icon-button type="button" class="remove-button" (click)="remove(item)" [hidden]="disabled"
            matTooltip="Remove {{noun}}">
            <mat-icon color="warn">delete</mat-icon>
        </button>
    </div>
</ng-container>
