<senergy-dialog-header [title]="title" (closed)="cancel()"></senergy-dialog-header>

<mat-dialog-content>
  @for (key of Object.keys(fields); track key) {
    <div class="ly-row">
      <mat-form-field class="full-width ly-flex" appearance="outline" color="accent">
        <mat-label>{{key | titlecase}}</mat-label>
        <input matInput placeholder="{{key | titlecase}}" [(ngModel)]="fields[key]" [required]="isRequired(key)">
      </mat-form-field>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" (click)="cancel()">Cancel</button>
  <button matButton="filled" (click)="ok()">OK</button>
</mat-dialog-actions>
