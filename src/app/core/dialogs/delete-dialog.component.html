<senergy-dialog-header title="Delete" (closed)="cancel()"></senergy-dialog-header>

<mat-dialog-content>
  <div>
    Should the {{text}} be deleted?
  </div>
  @if (options?.note) {
  <div>
    {{options?.note}}
  </div>
  }
  @if (options?.checkboxText) {
  <div>
    <mat-checkbox [(ngModel)]="checked">{{options?.checkboxText}}</mat-checkbox>
  </div>
  }

</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" (click)="cancel()">Cancel</button>
  <button matButton="filled" color="warn" (click)="delete()">Delete</button>
</mat-dialog-actions>
