<div>
  @if (state === 'online') {
    <mat-icon class="padding connected" matTooltip="connected">cloud</mat-icon>
  }
  @if (state === 'offline') {
    <mat-icon class="padding disconnected" matTooltip="disconnected">cloud_off</mat-icon>
  }
  @if (state === '') {
    <mat-icon class="padding color-sidenav" matTooltip="unknown">help outline</mat-icon>
  }
  @if (state === 'inactive') {
    <mat-icon class="padding inactive" matTooltip="inactive">cloud_off</mat-icon>
  }
</div>
