<!-- Both rows stay in the DOM: destroying the searchbar would reset the search text (see SearchbarComponent.ngOnDestroy). -->
<div class="toolbar-row" [hidden]="selectedCount > 0">
  @if (showSearch) {
    <senergy-searchbar [compact]="true" [searchTextIn]="searchTextIn" [supportRefresh]="supportRefresh" [disable]="searchDisabled" (refresh)="refresh.emit()"></senergy-searchbar>
  } @else if (supportRefresh) {
    <button mat-icon-button class="toolbar-refresh" aria-label="Refresh" (click)="refresh.emit()">
      <mat-icon>refresh</mat-icon>
    </button>
  }
  <div class="toolbar-filters">
    <ng-content select="[toolbarFilters]"></ng-content>
  </div>
</div>

<div class="selection-bar" role="toolbar" aria-label="Selection" [hidden]="selectedCount === 0">
  <span class="selection-count">{{selectedCount}} selected</span>
  <div class="selection-actions">
    <ng-content select="[bulkActions]"></ng-content>
  </div>
  <button mat-icon-button class="selection-clear" aria-label="Clear selection" (click)="clearSelection.emit()">
    <mat-icon>close</mat-icon>
  </button>
</div>
