<div>
  <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Sort" color="accent">
    <mat-icon>sort</mat-icon>
  </button>
  <mat-menu #menu="matMenu" [overlapTrigger]="false">
    @for (item of sortAttributes; track item; let i = $index) {
      <button mat-menu-item (click)="sendMessage(item, i) ">
        <div class="ly-row ly-align-start-center">
          <div [ngClass]="{'color-accent': i === selected}">{{item.label}}</div>
          @if (item.order === 'asc' && i === selected) {
            <mat-icon [ngClass]="{'color-accent': i === selected}">
              arrow_upward
            </mat-icon>
          }
          @if (item.order === 'desc' && i === selected) {
            <mat-icon [ngClass]="{'color-accent': i === selected}">
              arrow_downward
            </mat-icon>
          }
        </div>
      </button>
    }
  </mat-menu>
</div>
