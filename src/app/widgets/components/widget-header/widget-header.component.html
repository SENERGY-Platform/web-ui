<mat-card-header class="header-container drag-handler ly-row">
  <mat-card-title [matTooltip]="widget.name">
    {{widget.name}}
  </mat-card-title>
  <div class="ly-flex"></div>
  @if (warnText !== '') {
    <mat-icon
      color="warn"
      [ngClass]="{'padded-icon': zoom}"
      matTooltip="{{warnText}}">
      warning
    </mat-icon>
  }
  @for (icon of optionCustomIcon; track icon; let i = $index) {
    <div>
      <button mat-icon-button color="accent" (click)="custom(i)" [disabled]="optionCustomDisabled[i]" [matTooltip]="optionCustomTooltip[i]">
        <mat-icon>{{icon}}</mat-icon>
      </button>
    </div>
  }
  @if (zoom) {
    <div>
      <button mat-icon-button color="accent" (click)="refresh()" matTooltip="Refresh" [disabled]="refreshing">
        @if (!refreshing) {
          <mat-icon>refresh</mat-icon>
        }
        @if (refreshing) {
          <mat-icon>sync</mat-icon>
        }
        <!--<senergy-widget-spinner [show]="refreshing"></senergy-widget-spinner>-->
      </button>
    </div>
  }
  @if (zoom) {
    <div>
      <button mat-icon-button color="accent" (click)="zoomWidget()" matTooltip="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
</mat-card-header>
