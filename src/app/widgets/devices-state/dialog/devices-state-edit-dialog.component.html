<senergy-dialog-header title="Edit Devices State" (closed)="close()"></senergy-dialog-header>

<mat-dialog-content>
  <form class="ly-column" [formGroup]="formGroup">
    @if (userHasUpdateNameAuthorization) {
      <mat-form-field class="full-width">
        <mat-label>Widget Name</mat-label>
        <input matInput formControlName="name">
        <mat-error senergyError label="Widget Name"></mat-error>
      </mat-form-field>
    }
    @if (userHasUpdatePropertiesAuthorization) {
      <mat-form-field class="full-width">
        <mat-label>Location</mat-label>
        <mtx-select formControlName="location" [items]="locations" bindLabel="name"></mtx-select>
        <mat-error senergyError label="Location"></mat-error>
      </mat-form-field>

      <mat-checkbox formControlName="filter_inactive" color="accent">
        Filter Inactive Devices
      </mat-checkbox>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" (click)="close()">Cancel</button>
  <button matButton="filled" (click)="save()">Save</button>
</mat-dialog-actions>
