<mat-card appearance="outlined">
  <senergy-widget-header [widget]="widget" [refreshing]="refreshing"></senergy-widget-header>
  <mat-card-content class="drag-handler">
    <senergy-widget-spinner [show]="!ready"></senergy-widget-spinner>
    @if (ready) {
      <div class="ly-column ly-fill">
        <div (click)="showOnlineDevices()" class="clickable ly-row ly-flex-third">
          <div class="widget-icon-green ly-row ly-fill-flex ly-flex-30 ly-align-center-center">
            <mat-icon class="mat-32 white">cloud</mat-icon>
          </div>
          <div class="ly-fill-flex ly-flex-70 ly-column">
            <div class="kpi-header-1-3">ONLINE</div>
            <div class="ly-row">
              <div class="mat-h2 kpi-1-3">{{devicesStatus.connected}}</div>
              <div class="kpi-text-1-3">/ {{devicesStatus.count}}</div>
            </div>
          </div>
        </div>
        <div class="ly-flex-8px"></div>
        <div (click)="showOfflineDevices()" class="clickable ly-row ly-flex-third">
          <div class="widget-icon-red ly-row ly-fill-flex ly-flex-30 ly-align-center-center">
            <mat-icon class="mat-32 white">cloud_off</mat-icon>
          </div>
          <div class="ly-fill-flex ly-flex-70 ly-column">
            <div class="kpi-header-1-3">OFFLINE</div>
            <div class="ly-row">
              <div class="mat-h2 kpi-1-3">{{devicesStatus.disconnected}}</div>
              <div class="kpi-text-1-3">/ {{devicesStatus.count}}</div>
            </div>
          </div>
        </div>
        <div class="ly-flex-8px"></div>
        <div (click)="showUnknownDevices()" class="clickable ly-row ly-flex-third">
          <div class="widget-icon-orange ly-row ly-fill-flex ly-flex-30 ly-align-center-center">
            <mat-icon class="white mat-32">help outline</mat-icon>
          </div>
          <div class="ly-fill-flex ly-flex-70 ly-column">
            <div class="kpi-header-1-3">UNKNOWN</div>
            <div class="ly-row">
              <div class="mat-h2 kpi-1-3">{{devicesStatus.unknown}}</div>
              <div class="kpi-text-1-3">/ {{devicesStatus.count}}</div>
            </div>
          </div>
        </div>
      </div>
    }
  </mat-card-content>
  <senergy-widget-footer [userHasUpdateNameAuthorization]="userHasUpdateNameAuthorization" [refreshing]="refreshing" [userHasDeleteAuthorization]="userHasDeleteAuthorization" [userHasUpdatePropertiesAuthorization]="userHasUpdatePropertiesAuthorization" [dashboardId]="dashboardId" [widget]="widget" (editEvent)="edit()"></senergy-widget-footer>
</mat-card>
