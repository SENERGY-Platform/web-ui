<mat-card appearance="outlined">
  <senergy-widget-header [widget]="widget" [refreshing]="refreshing"></senergy-widget-header>
  <mat-card-content class="drag-handler">
    <senergy-widget-spinner [show]="!ready"></senergy-widget-spinner>
    @if (ready) {
      <div class="states">
        <button type="button" class="state" (click)="showOnlineDevices()">
          <span class="badge online"><mat-icon>cloud</mat-icon></span>
          <span class="label">Online</span>
          <span class="count">{{devicesStatus.connected}}<span class="total">/{{devicesStatus.count}}</span></span>
        </button>
        <button type="button" class="state" (click)="showOfflineDevices()">
          <span class="badge offline"><mat-icon>cloud_off</mat-icon></span>
          <span class="label">Offline</span>
          <span class="count">{{devicesStatus.disconnected}}<span class="total">/{{devicesStatus.count}}</span></span>
        </button>
        <button type="button" class="state" (click)="showUnknownDevices()">
          <span class="badge unknown"><mat-icon>help_outline</mat-icon></span>
          <span class="label">Unknown</span>
          <span class="count">{{devicesStatus.unknown}}<span class="total">/{{devicesStatus.count}}</span></span>
        </button>
      </div>
    }
  </mat-card-content>
  <senergy-widget-footer [userHasUpdateNameAuthorization]="userHasUpdateNameAuthorization" [refreshing]="refreshing" [userHasDeleteAuthorization]="userHasDeleteAuthorization" [userHasUpdatePropertiesAuthorization]="userHasUpdatePropertiesAuthorization" [dashboardId]="dashboardId" [widget]="widget" (editEvent)="edit()"></senergy-widget-footer>
</mat-card>
