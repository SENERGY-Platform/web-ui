<div class="toolbar">
  <mat-icon title="Zoom In" (click)="zoomIn()">add_circle_outline</mat-icon>
  <mat-icon title="Zoom Out" (click)="zoomOut()">remove_circle_outline</mat-icon>
  <mat-icon title="Selection Zoom" [class.selected]="mode === 'zoom'" (click)="setMode('zoom')">zoom_in</mat-icon>
  <mat-icon title="Panning" [class.selected]="mode === 'pan'" (click)="setMode('pan')">pan_tool</mat-icon>
  <mat-icon title="Reset Zoom" (click)="reset()">home</mat-icon>
  <mat-icon title="Menu" (click)="menuOpen = !menuOpen">menu</mat-icon>
  @if (menuOpen) {
    <div class="menu">
      <div class="menu-item" (click)="downloadPng()">Download PNG</div>
      <div class="menu-item" (click)="downloadCsv()">Download CSV</div>
    </div>
  }
</div>
