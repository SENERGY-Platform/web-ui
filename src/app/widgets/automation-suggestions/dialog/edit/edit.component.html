<h2 mat-dialog-title>Edit Automation Suggestions</h2>

<mat-dialog-content>
    <senergy-widget-spinner [show]="!ready"></senergy-widget-spinner>
    <div *ngIf="ready">
        <form fxLayout="column" [formGroup]="form">
            <mat-form-field color="accent" appearance="outline" fxFlex="47" *ngIf="userHasUpdateNameAuthorization">
                <mat-label>Widget Name</mat-label>
                <input type="text" matInput formControlName="name" required>
                <mat-error senergyError [label]="'Widget name'"></mat-error>
            </mat-form-field>

            <div *ngIf="instances.length > 0 && userHasUpdatePropertiesAuthorization" fxLayout="column">
                <h2>Automation suggestion instance</h2>
                <mat-form-field color="accent" appearance="outline" fxFlex="47">
                    <mat-label>Choose instance</mat-label>
                    <mat-error senergyError [label]="'Instance'"></mat-error>
                    <mtx-select formControlName="instance" required [items]="instances" bindLabel="name"
                        [compareWith]="compare" appendTo=".ng-select-anchor">
                    </mtx-select>
                </mat-form-field>
            </div>
            <div *ngIf="instances.length === 0">
                No instance of the release "Automatisierungsvorschläge" is available. Start one as smart service first.
            </div>
        </form>
    </div>
</mat-dialog-content>

<mat-dialog-actions fxLayoutAlign="end center">
    <button mat-raised-button color="primary" (click)="close()">Cancel</button>
    <button mat-raised-button color="accent" (click)="save()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
