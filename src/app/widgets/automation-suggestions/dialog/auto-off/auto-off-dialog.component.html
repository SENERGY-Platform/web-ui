<h2 mat-dialog-title>Switch off after</h2>

<mat-dialog-content>
    <mat-form-field appearance="outline">
        <mat-label>Seconds</mat-label>
        <input matInput type="text" inputmode="numeric" [formControl]="seconds" (keydown.enter)="set()" autofocus>
        <span matTextSuffix>s</span>
        <mat-error>Enter whole seconds from 5 to 3600.</mat-error>
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="accent" [disabled]="seconds.invalid" (click)="set()">Set</button>
</mat-dialog-actions>
