<div style="width: 100%; height: 100%;">
  @if (config) {
    <div class="chart">
      <div class="canvas-box" [style.width.px]="0.9 * width" [style.height.px]="0.9 * height">
        <canvas baseChart type="bar" [data]="config.data" [options]="config.options" (chartClick)="onChartClick($event.active)"
          (contextmenu)="resetZoom(); false"></canvas>
      </div>
    </div>
  }
</div>
