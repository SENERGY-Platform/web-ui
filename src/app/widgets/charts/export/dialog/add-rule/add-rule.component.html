<senergy-dialog-header [title]="title" (closed)="cancel()"></senergy-dialog-header>

<mat-dialog-content>
    <div [formGroup]="form">
        <mat-form-field class="full-width">
            <mat-label>From</mat-label>
            <input matInput type="text" formControlName="from" required>
			<mat-error senergyError label="From"></mat-error>
        </mat-form-field>
        
        <mat-form-field class="full-width">
            <mat-label>To</mat-label>
            <input matInput type="text" formControlName="to" required>
			<mat-error senergyError label="To"></mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Color</mat-label>
            <input matInput type="text" formControlName="color">
            <mat-error senergyError label="Color"></mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Alias</mat-label>
            <input matInput type="text" formControlName="alias">
            <mat-error senergyError label="Alias"></mat-error>
        </mat-form-field>
    </div>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton="outlined" type="submit" (click)="cancel()">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="!form.valid" (click)="add()" >Add</button>

</mat-dialog-actions>
