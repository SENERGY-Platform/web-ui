<senergy-dialog-header title="Edit Leakage Detection" (closed)="close()"></senergy-dialog-header>

<mat-dialog-content>
  <senergy-widget-spinner [show]="!ready"></senergy-widget-spinner>
  @if (ready) {
    <div>
      <form [formGroup]="form">
        @if (userHasUpdateNameAuthorization) {
          <mat-form-field class="full-width">
            <mat-label>Widget Name</mat-label>
            <input type="text" matInput formControlName="name">
            <mat-error senergyError label="Widget Name"></mat-error>
          </mat-form-field>
        }
        @if (userHasUpdatePropertiesAuthorization) {
          <mat-form-field class="full-width">
            <mat-label>Export</mat-label>
            <mtx-select placeholder="Choose Export" formControlName="export" [items]="exports" required
              bindLabel="Name" appendTo=".ng-select-anchor">
            </mtx-select>
            <mat-error senergyError label="Export"></mat-error>
          </mat-form-field>
        }
      </form>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" (click)="close()">Cancel</button>
  <button matButton="filled" (click)="save()" [disabled]="form.invalid">Save</button>
</mat-dialog-actions>
