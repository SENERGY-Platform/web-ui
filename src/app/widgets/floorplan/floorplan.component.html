<mat-card appearance="outlined" (mouseleave)="forbidChartjsTooltip()" (mouseenter)="allowChartjsTooltip()">
  <senergy-widget-header [widget]="widget" [zoom]="zoom" [refreshing]="refreshing"></senergy-widget-header>
  <mat-card-content>
    <div *ngIf="ready && widget.properties.floorplan === undefined" class="content">
      <div>Please configure widget!</div>
    </div>
    <senergy-widget-spinner
      [show]="widget.properties.floorplan !== undefined && (!ready || draws < 2)"></senergy-widget-spinner>
    <div [hidden]="!ready || !widget.properties.floorplan === undefined" class="content">
      <div class="image-wrapper" #imageWrapper>
        <canvas #canvas baseChart [data]="chartjs.data" [options]="chartjs.options" type="scatter"
          id="chartjs-{{widget.id}}" [plugins]="chartjs.plugins" [ngClass]="{'hidden': draws < 2}"></canvas>
        <div *ngIf="chartjs.tooltipAllowed && chartjs.tooltipContext !== undefined" id="chartjs-tooltip" #chartjsTooltip class="mat-elevation-z4"
          [ngStyle]="chartjsTooltipStyle">
          <table>
            <ng-container *ngFor="let title of chartjs.tooltipContext.tooltip.title; let i = index">
              <thead>
                <tr>
                  <td colspan="2">{{title}}</td>
                  <td><button mat-icon-button color="warn" class="small-icon-button"
                      (click)="closeChartjsTooltip()"><mat-icon>close</mat-icon></button></td>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <span class="tooltip-colorbox"
                      [ngStyle]="{'background': chartjs.tooltipContext.tooltip.labelColors[i].backgroundColor}"></span>
                  </td>
                  <!-- a measurement that operates a control shows its value as the button doing so -->
                  <td colspan="2"
                    [ngClass]="{'value-link': linkedControl(chartjs.tooltipDatasets[i].datasetIndex, widget.properties.floorplan!.placements[chartjs.tooltipDatasets[i].datasetIndex].criteria) !== undefined}"
                    [matTooltip]="linkedControl(chartjs.tooltipDatasets[i].datasetIndex, widget.properties.floorplan!.placements[chartjs.tooltipDatasets[i].datasetIndex].criteria)?.label || ''"
                    (click)="performLinkedControl(chartjs.tooltipDatasets[i].datasetIndex, widget.properties.floorplan!.placements[chartjs.tooltipDatasets[i].datasetIndex].criteria)">
                    {{this.chartjs.tooltipDatasets[i].label}}
                  </td>
                </tr>
                <ng-container *ngFor="let line of chartjs.tooltipCriteria">
                  <ng-container *ngIf="line.matchDsIndex === this.chartjs.tooltipDatasets[i].datasetIndex">
                    <tr *ngFor="let c of line.values">
                      <td>{{c.description}}</td>
                      <td colspan="2" [ngClass]="{'value-link': linkedControl(line.matchDsIndex, c.criteria) !== undefined}"
                        [matTooltip]="linkedControl(line.matchDsIndex, c.criteria)?.label || ''"
                        (click)="performLinkedControl(line.matchDsIndex, c.criteria)">{{c.label}}</td>
                    </tr>
                    <tr *ngFor="let control of compactControls(line.matchDsIndex)">
                      <td>{{control.label}}</td>
                      <td colspan="2">
                        <senergy-capability-control [control]="control" [compact]="true"
                          (run)="performControl(line.matchDsIndex, $event)"></senergy-capability-control>
                      </td>
                    </tr>
                    <tr *ngIf="needsControlDialog(line.matchDsIndex)">
                      <td colspan="3" class="tooltip-actions">
                        <button mat-icon-button color="accent" class="small-icon-button"
                          (click)="openControlDialog(line.matchDsIndex)" matTooltip="Controls">
                          <mat-icon>tune</mat-icon>
                        </button>
                      </td>
                    </tr>
                  </ng-container>
                </ng-container>
              </tbody>
            </ng-container>

          </table>
        </div>
        <table class="unplaced-table mat-elevation-z4" *ngIf="unplacedRows.length > 0">
          <tr *ngFor="let row of unplacedRows">
            <td><mat-icon [style.color]="row.color" class="unplaced-icon">{{row.icon}}</mat-icon></td>
            <td class="unplaced-alias">{{row.alias}}</td>
            <td class="unplaced-value"
              [ngClass]="{'value-link': linkedControl(row.index, widget.properties.floorplan!.placements[row.index].criteria) !== undefined}"
              [matTooltip]="linkedControl(row.index, widget.properties.floorplan!.placements[row.index].criteria)?.label || ''"
              (click)="performLinkedControl(row.index, widget.properties.floorplan!.placements[row.index].criteria)">{{row.value}}</td>
            <td class="unplaced-action">
              <senergy-capability-control *ngFor="let control of compactControls(row.index)" [control]="control"
                [compact]="true" (run)="performControl(row.index, $event)"></senergy-capability-control>
              <button *ngIf="needsControlDialog(row.index)" mat-icon-button color="accent" class="small-icon-button"
                (click)="openControlDialog(row.index)" matTooltip="Controls">
                <mat-icon>tune</mat-icon>
              </button>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </mat-card-content>
  <div>
    <senergy-widget-footer [widgetHasUpdateableProperties]="true"
      [userHasUpdateNameAuthorization]="userHasUpdateNameAuthorization"
      [userHasDeleteAuthorization]="userHasDeleteAuthorization"
      [userHasUpdatePropertiesAuthorization]="userHasUpdatePropertiesAuthorization" [dashboardId]="dashboardId"
      [widget]="widget" [optionZoom]="true" [zoom]="zoom" (editEvent)="edit()" [refreshing]="refreshing">
    </senergy-widget-footer>
  </div>
</mat-card>
