<div class="timeline ly-row">
  <button mat-icon-button color="accent" class="timeline-play" (click)="toggle()"
    [disabled]="loading() || frames().length < 2" [matTooltip]="playing() ? 'Pause' : 'Play'">
    <mat-icon>{{playing() ? 'pause' : 'play_arrow'}}</mat-icon>
  </button>
  <mat-slider class="timeline-slider ly-flex" [min]="0" [max]="frames().length - 1" [step]="1" [discrete]="false"
    [disabled]="loading() || frames().length < 2">
    <input matSliderThumb [value]="index()" (valueChange)="pick($event)">
  </mat-slider>
  <span class="timeline-time">
    @if (loading()) {
      Loading
    } @else if (current !== undefined) {
      {{current | date:'EEE HH:mm'}}
    } @else {
      No history
    }
  </span>
  @for (s of speeds; track s.label; let i = $index) {
    <button mat-icon-button class="timeline-speed" [class.timeline-speed-on]="speed() === i"
      (click)="setSpeed(i)" [matTooltip]="'Speed ' + s.label">
      <span>{{s.label}}</span>
    </button>
  }
  <button mat-icon-button color="accent" class="timeline-leave" (click)="leave.emit()" matTooltip="Back to now">
    <mat-icon>update</mat-icon>
  </button>
</div>
