@if (chartsReady && valueChartData) {
  <div>
    @if (render) {
      <div class="chart-frame" [style.width.px]="chartWidth" [style.height.px]="chartHeight">
        <senergy-chart-toolbar [chart]="valueChart"></senergy-chart-toolbar>
        <div class="chart-box">
          <canvas baseChart #valueChart="base-chart" type="line" [data]="valueChartData.data" [options]="valueChartData.options"
            [plugins]="chartPlugins"></canvas>
        </div>
      </div>
    }
    @if (showFrequencyAnomalies === true && timeChartData) {
      <div>
        @if (render) {
          <div class="chart-frame" [style.width.px]="chartWidth" [style.height.px]="chartHeight">
            <senergy-chart-toolbar [chart]="timeChart"></senergy-chart-toolbar>
            <div class="chart-box">
              <canvas baseChart #timeChart="base-chart" type="line" [data]="timeChartData.data" [options]="timeChartData.options"
                [plugins]="chartPlugins"></canvas>
            </div>
          </div>
        }
      </div>
    }
  </div>
}
